[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "forgeops-platform"
version = "0.1.0"
description = "ForgeOps Platform Core and Scenario SDK local synthetic engineering baseline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary - local engineering evaluation only" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "jsonschema>=4.24,<5",
  "opentelemetry-api>=1.34,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
  "opentelemetry-sdk>=1.34,<2",
  "packaging>=25,<26",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.15,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.1,<8",
  "httpx>=0.28,<1",
  "httpx2>=2.9,<3",
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.24,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeops"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "postgres: requires a PostgreSQL service",
  "temporal: requires a Temporal service",
]

[tool.coverage.run]
branch = true
source = ["forgeops"]

[tool.coverage.report]
fail_under = 80
show_missing = true
