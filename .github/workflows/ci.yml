name: forgeops-engineering-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
        with:
          version: "0.12.0"
          python-version: "3.13.14"
          enable-cache: true
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: "11.1.2"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.14.0"
          cache: pnpm
      - run: uv sync --frozen --all-groups
      - run: pnpm install --frozen-lockfile
      - run: uv run alembic upgrade head
      - run: make verify
      - run: make migration-proof
      - run: make smoke
      - run: make web-smoke
      - run: make sbom
      - run: make evidence
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: forgeops-local-engineering-evidence
          path: |
            coverage.xml
            artifacts/generated/
            docs/acceptance/generated-verification-evidence.json
